name: Update Sunwave Products

on:
  schedule:
    - cron: "0 */6 * * *"
      timezone: "Europe/Budapest"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-products:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run supplier update
        run: python SunwaveProductUpdate.py

      - name: Save changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SunwaveProducts.csv SunwaveUpdateLogs.txt

          git diff --cached --quiet || git commit -m "Update Sunwave products"

          git push
